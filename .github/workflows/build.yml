name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Fetch Harper (stub in Phase 1)
        shell: pwsh
        run: .\tools\fetch-harper.ps1

      - name: Restore
        run: dotnet restore Typee.sln

      - name: Build
        run: dotnet build Typee.sln --no-restore -c Release

      - name: Test
        run: dotnet test Typee.sln --no-build -c Release --verbosity normal
